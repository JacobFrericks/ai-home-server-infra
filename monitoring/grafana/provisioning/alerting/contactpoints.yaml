apiVersion: 1

# Sends firing/resolved alerts to Home Assistant, which relays them as a native
# push notification to the HA Companion app on a phone. HA is host-networked on
# :8123; the Grafana container reaches it over the LAN IP (host.docker.internal did
# not resolve from this container during setup).
#
# HOST_LAN_IP is interpolated by Grafana from the environment (see
# monitoring/docker-compose.yml, value in the git-ignored monitoring/.env) so the
# server's address is not hardcoded in this public repo.
contactPoints:
  - orgId: 1
    name: ha-mobile
    receivers:
      - uid: ha_mobile_webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://$HOST_LAN_IP:8123/api/webhook/grafana_alerts
          httpMethod: POST
