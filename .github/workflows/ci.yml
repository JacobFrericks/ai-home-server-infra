name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate compose file
        env:
          # Any non-empty value satisfies interpolation; this is NOT a real secret.
          WEBUI_SECRET_KEY: ci-dummy-not-a-real-secret
        run: docker compose -f docker-compose.yml config -q

      - name: Lint YAML
        run: |
          pipx install yamllint
          yamllint -d relaxed docker-compose.yml monitoring/ .github/

      - name: Assert every image is pinned by digest
        # A tag records what the publisher most recently CALLED an image; a
        # digest records what it IS. Only the second is immutable. Two of the
        # four images here live on Docker Hub accounts outside our control, and
        # the weekly cron deploy.sh does `docker compose pull` as a user in the
        # docker group -- root-equivalent. A re-pushed tag would run here with
        # no commit and no signal.
        #
        # Renovate's pinDigests (configured in the sibling k8s repo, which
        # governs this one too) makes new images arrive pinned. This is the
        # half that keeps them that way.
        run: |
          pipx install --quiet pyyaml 2>/dev/null || pip install --quiet pyyaml
          python3 .github/scripts/check-image-digests.py

      - name: Scan for committed secrets
        # Full-history scan via the gitleaks CLI. We don't use gitleaks-action's
        # push-range diffing because it derefs <base>^ and fails on a repo's root
        # commit (initial push). `gitleaks git .` scans all history deterministically.
        run: |
          VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact -v --exit-code 2 --config .gitleaks.toml
