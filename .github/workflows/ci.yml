name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # zizmor (added below): a floating tag is one compromised upstream
          # release away from arbitrary code running with this repo's push
          # access -- same reasoning check-image-digests.py already applies
          # to image tags. A SHA records what an action IS, not what it was
          # most recently CALLED.
          persist-credentials: false

      - name: Validate compose file
        env:
          # Any non-empty value satisfies interpolation; this is NOT a real secret.
          WEBUI_SECRET_KEY: ci-dummy-not-a-real-secret
        run: docker compose -f docker-compose.yml config -q

      - name: Lint YAML
        run: |
          pipx install yamllint
          yamllint -d relaxed docker-compose.yml monitoring/ .github/

      - name: ShellCheck all scripts
        # Every script here runs as root on the home server (deploy.sh, the
        # setup-*.sh installers, the verify-*.sh checks). Hard gate: this repo
        # owns every line of them, unlike the third-party image findings the
        # image-scan workflow baselines rather than blocks on.
        # -S warning: keep style-only "info" notes (SC2015/SC2016 etc.) as
        # local nitpicks, not a red build.
        #
        # The trivy image scan that used to live in this job moved to
        # .github/workflows/image-scan.yml; scan-images.sh is its body, so it
        # is checked here alongside the rest.
        run: shellcheck -S warning deploy.sh scripts/*.sh .github/scripts/scan-images.sh

      - name: Bandit — warn-only
        # ~8k LOC of glue and MCP servers taking LLM-supplied input (memory-mcp,
        # comfyui-mcp, scripts/, the HA custom_components except the vendored
        # wyzeapi integration -- not this repo's code, excluded). Warn-only for
        # the first month per the security-scanning-ci plan, so the real noise
        # level is known before this becomes a hard gate.
        run: |
          pipx install --quiet bandit 2>/dev/null || pip install --quiet bandit
          bandit -r . -ll \
            --exclude ./homeassistant/custom_components/wyzeapi \
            --exit-zero

      - name: zizmor — GitHub Actions supply-chain lint
        # zizmor catches the class of bug gitleaks and yamllint both miss: an
        # action pinned by a mutable tag instead of a SHA, a workflow that
        # hands a fork PR's untrusted input straight to `run:`, secrets
        # leaking into a log via debug output, and similar. Hard fail --
        # this repo's own workflows are exactly what an attacker would target
        # to get at the build-bot GitHub App's push access. Matches the
        # sibling k8s repo's invocation.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=1.30.0
          BASE=https://github.com/woodruffw/zizmor/releases/download
          curl -sSL "$BASE/v${VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /tmp zizmor
          /tmp/zizmor --min-severity medium .

      - name: Assert every image is pinned by digest
        # A tag records what the publisher most recently CALLED an image; a
        # digest records what it IS. Only the second is immutable. Two of the
        # four images here live on Docker Hub accounts outside our control, and
        # the weekly cron deploy.sh does `docker compose pull` as a user in the
        # docker group -- root-equivalent. A re-pushed tag would run here with
        # no commit and no signal.
        #
        # Renovate's pinDigests (configured in the sibling k8s repo, which
        # governs this one too) makes new images arrive pinned. This is the
        # half that keeps them that way.
        run: |
          pipx install --quiet pyyaml 2>/dev/null || pip install --quiet pyyaml
          python3 .github/scripts/check-image-digests.py

      - name: Scan for committed secrets
        # Full-history scan via the gitleaks CLI. We don't use gitleaks-action's
        # push-range diffing because it derefs <base>^ and fails on a repo's root
        # commit (initial push). `gitleaks git .` scans all history deterministically.
        run: |
          VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact -v --exit-code 2 --config .gitleaks.toml
